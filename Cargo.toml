[package]
name = "zunesha"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Shared GPU device substrate — device, queues, and buffer allocation for the Industrial Algebra ecosystem (consumed by Borsalino and Goldenweek)"
license = "Apache-2.0"
repository = "https://github.com/industrial-algebra/Zunesha"
keywords = ["gpu", "device", "vulkan", "metal", "hardware"]
categories = ["hardware-support"]

[features]
default = []
# v0.1 ships the `Device` trait, the opaque-handle surface, the ported epoch
# tracker, a NoDevice stub, and the complete Vulkan backend. Metal lands
# post-v0.1 (substrate-first: Zunesha-Metal precedes Goldenweek-Metal).
metal = ["dep:objc"]
vulkan = ["dep:ash"]
# karpal-verify obligation bundles for device/buffer-lifecycle properties
# (buffer alignment, quiescence). Lands alongside the verification seam.
verify = []

[dependencies]
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }

# NOTE: Zunesha does NOT depend on naga — it never compiles shaders. That stays
# in Borsalino (compute) and Goldenweek (graphics). Zunesha is strictly the
# device + queues + memory + buffer layer.
#
# Backend dependencies are reintroduced alongside src/metal.rs / src/vulkan.rs.
# Vulkan is live from this release; Metal still pending.
[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "0.2", optional = true } # raw objc_msgSend FFI (Metal backend)

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ash = { version = "0.38", optional = true }

[dev-dependencies]
# GPU tests touch the Vulkan loader, which is not safe under concurrent
# instance/device creation (SIGSEGV when a WSI-enabled instance is created in
# parallel with a plain one). `#[serial]` keeps the vulkan tests from racing
# the loader.
serial_test = "3"

[[example]]
name = "device-info"
required-features = ["vulkan"]

[[example]]
name = "buffer-roundtrip"
required-features = ["vulkan"]
# (quiescence runs on default features — pure CPU, CI-safe)

# Still pending:
# verify will add: karpal-verify, karpal-proof (optional).
